<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HealthChef - Personalized Recipe Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
  <style>
    .gradient-bg {
      background: linear-gradient(135deg, #5D5CDE 0%, #7C3AED 100%);
    }
    .card-shadow {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1),
                  0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }
    .recipe-content h1, .recipe-content h2, .recipe-content h3 {
      color: #374151;
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
      font-weight: 600;
    }
    .dark .recipe-content h1, .dark .recipe-content h2, .dark .recipe-content h3 {
      color: #E5E7EB;
    }
    .loading-dots {
      animation: loading 1.4s infinite ease-in-out;
    }
    .loading-dots:nth-child(1) { animation-delay: -0.32s; }
    .loading-dots:nth-child(2) { animation-delay: -0.16s; }
    @keyframes loading {
      0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen transition-colors duration-300">

  <!-- Header -->
  <header class="gradient-bg text-white py-8">
    <div class="container mx-auto px-4 text-center">
      <h1 class="text-4xl md:text-5xl font-bold mb-3">🍽️ HealthChef</h1>
      <p class="text-xl opacity-90 max-w-2xl mx-auto">
        Personalized recipes crafted by AI experts in medicine, nutrition, and culinary arts
      </p>
    </div>
  </header>

  <!-- Main Container -->
  <div class="container mx-auto px-4 py-8 max-w-4xl">
    
    <!-- Input Form -->
    <div class="bg-white dark:bg-gray-800 rounded-2xl card-shadow p-6 md:p-8 mb-8">
      <h2 class="text-2xl font-bold text-gray-800 dark:text-white mb-6">Tell us about yourself</h2>
      
      <form id="recipeForm" class="space-y-6">
        
        <!-- Health Conditions -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">
            Health Conditions & Medical History
          </label>
          <textarea id="healthConditions" class="w-full p-4 border rounded-xl dark:bg-gray-700"></textarea>
        </div>

        <!-- Allergies -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">
            Allergies & Restrictions
          </label>
          <textarea id="allergies" class="w-full p-4 border rounded-xl dark:bg-gray-700"></textarea>
        </div>

        <!-- Goals -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">
            Health & Wellness Goals
          </label>
          <textarea id="goals" class="w-full p-4 border rounded-xl dark:bg-gray-700"></textarea>
        </div>

        <!-- Tastes -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">
            Taste Preferences & Cuisines
          </label>
          <textarea id="tastes" class="w-full p-4 border rounded-xl dark:bg-gray-700"></textarea>
        </div>

        <!-- Meal Type -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">
            Preferred Meal Type
          </label>
          <select id="mealType" class="w-full p-4 border rounded-xl dark:bg-gray-700">
            <option value="any">Any meal</option>
            <option value="breakfast">Breakfast</option>
            <option value="lunch">Lunch</option>
            <option value="dinner">Dinner</option>
            <option value="snack">Snack</option>
            <option value="smoothie">Smoothie</option>
          </select>
        </div>

        <!-- Generate Button -->
        <button type="submit" id="generateBtn"
          class="w-full bg-primary hover:bg-primary-dark text-white font-semibold py-4 px-6 rounded-xl">
          <span id="btnText">✨ Generate My Personalized Recipe</span>
          <div id="btnLoading" class="hidden">⏳ Loading...</div>
        </button>
      </form>
    </div>

    <!-- Results Section -->
    <div id="resultsSection" class="hidden">
      <div class="bg-white dark:bg-gray-800 rounded-2xl card-shadow p-6 md:p-8">
        <div class="flex justify-between">
          <h2 class="text-2xl font-bold">Your Personalized Recipe</h2>
          <button id="newRecipeBtn" class="bg-gray-200 px-4 py-2 rounded-lg">New Recipe</button>
        </div>
        <div id="recipeContent" class="recipe-content prose max-w-none mt-4"></div>
      </div>
    </div>

    <!-- Loading Section -->
    <div id="loadingSection" class="hidden text-center">
      <p class="text-lg font-semibold">Analyzing your needs...</p>
    </div>

    <!-- Error Section -->
    <div id="errorSection" class="hidden text-center text-red-600">
      <p id="errorMessage"></p>
      <button id="retryBtn" class="mt-4 bg-red-600 text-white px-4 py-2 rounded-lg">Try Again</button>
    </div>

  </div> <!-- End main -->

  <!-- Script at bottom fixes the null error -->
  <script>
    // Dark mode
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.classList.add('dark');
    }

    const form = document.getElementById('recipeForm');
    const generateBtn = document.getElementById('generateBtn');
    const btnText = document.getElementById('btnText');
    const btnLoading = document.getElementById('btnLoading');
    const loadingSection = document.getElementById('loadingSection');
    const resultsSection = document.getElementById('resultsSection');
    const errorSection = document.getElementById('errorSection');
    const recipeContent = document.getElementById('recipeContent');
    const newRecipeBtn = document.getElementById('newRecipeBtn');
    const retryBtn = document.getElementById('retryBtn');

    let isGenerating = false;

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      await generateRecipe();
    });
    newRecipeBtn.addEventListener('click', () => {
      hideAllSections();
      form.scrollIntoView({ behavior: 'smooth' });
    });
    retryBtn.addEventListener('click', () => {
      generateRecipe();
    });

    async function generateRecipe() {
      if (isGenerating) return;
      const healthConditions = document.getElementById('healthConditions').value;
      const allergies = document.getElementById('allergies').value;
      const goals = document.getElementById('goals').value;
      const tastes = document.getElementById('tastes').value;
      const mealType = document.getElementById('mealType').value;

      if (!healthConditions && !allergies && !goals && !tastes) {
        showError("Please fill in at least one field.");
        return;
      }

      setLoadingState(true);
      showLoadingSection();

      const prompt = `As a team of doctors, nutritionists, and chefs, create a personalized ${mealType} recipe:
      Health: ${healthConditions || 'None'}
      Allergies: ${allergies || 'None'}
      Goals: ${goals || 'General wellness'}
      Tastes: ${tastes || 'Any'}

      Include: Analysis, Nutrient breakdown, Recipe name, Ingredients, Instructions, Tips, Nutrition facts, Benefits.`;

      try {
        const response = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer YOUR_OPENAI_API_KEY_HERE`
          },
          body: JSON.stringify({
            model: "gpt-4o-mini",
            messages: [{ role: "user", content: prompt }]
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        showResults(data.choices[0].message.content);

      } catch (err) {
        showError("Error: " + err.message);
      }
    }

    function showLoadingSection() {
      hideAllSections();
      loadingSection.classList.remove('hidden');
    }
    function showResults(content) {
      setLoadingState(false);
      hideAllSections();
      recipeContent.innerHTML = marked.parse(content);
      resultsSection.classList.remove('hidden');
    }
    function showError(msg) {
      setLoadingState(false);
      hideAllSections();
      document.getElementById('errorMessage').textContent = msg;
      errorSection.classList.remove('hidden');
    }
    function hideAllSections() {
      loadingSection.classList.add('hidden');
      resultsSection.classList.add('hidden');
      errorSection.classList.add('hidden');
    }
    function setLoadingState(loading) {
      isGenerating = loading;
      generateBtn.disabled = loading;
      if (loading) {
        btnText.classList.add('hidden');
        btnLoading.classList.remove('hidden');
      } else {
        btnText.classList.remove('hidden');
        btnLoading.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
